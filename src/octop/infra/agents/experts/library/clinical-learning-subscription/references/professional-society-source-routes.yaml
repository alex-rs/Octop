independent_professional_societies:
  - id: chinese-pharmaceutical-association
    name: Chinese Pharmaceutical Association
    aliases: [pharmacy, clinical pharmacy, hospital pharmacy, rational drug use]
    official_url: https://www.cpa.org.cn/
    canonical_domains: [cpa.org.cn, "*.cpa.org.cn"]
    authority_scope: Society standards, guidelines, and specifications formally published by the Chinese Pharmaceutical Association, together with their correction notices
    evidence_status: conditional_final
    acceptance_evidence:
      - T/CPHARMA 002-2019《Guidelines on the Methodology of Pharmacoepidemiology Research》
      - T/CPHARMA 004-2020《Specification for the Safe Use and Management of Insulin in Medical Institutions》
      - T/CPHARMA 008-2025《Specification for Compiling the Catalogue of Emergency Response Guarantee Drugs》
  - id: chinese-stroke-association
    name: Chinese Stroke Association
    aliases: [stroke, cerebral stroke, cerebrovascular disease, neurology]
    official_url: https://www.csa-stroke.com/
    canonical_domains: [csa-stroke.com, "*.csa-stroke.com"]
    authority_scope: The identity and release information of guidelines and consensus statements published by the society and its branches
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: A release news item or a directory page can only locate the original text; it may serve as the final basis only after the complete formal body text is obtained and the identity is verified.
  - id: chinese-association-of-rehabilitation-medicine
    name: Chinese Association of Rehabilitation Medicine
    aliases: [rehabilitation medicine, rehabilitation department, physical medicine and rehabilitation]
    official_url: https://www.carm.org.cn/
    canonical_domains: [carm.org.cn, "*.carm.org.cn"]
    authority_scope: The identity and release information of standards, guidelines, and consensus statements published by the society and its professional committees
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: Popular-science, competition, conference, and reprint pages must not serve as the original text of a formal guideline or consensus.
  - id: chinese-nursing-association
    name: Chinese Nursing Association
    aliases: [nursing, nursing management, primary-care nursing]
    official_url: https://www.cna-cn.com/
    canonical_domains: [cna-cn.com, "*.cna-cn.com", zhhlxh.org.cn, "*.zhhlxh.org.cn"]
    authority_scope: The identity information of nursing society standards, guidelines, or specifications formally published by the society
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: Membership, live-stream, training, and news pages serve only as discovery leads.
