schema_version: 1
purpose: >-
  Provide certain retrieval routes for Chinese medical professional societies, associations, and
  their specialty branches. This table is meant to reduce whole-web search guesswork; it does not
  automatically upgrade all content on a website into final evidence.
verified_at: 2026-08-25

evidence_contract:
  final_content_types:
    - Original text of a formal guideline or consensus
    - Original text of a formal specification, clinical pathway, quality-control standard, or society standard
    - Formal correction, withdrawal, replacement, or version notice
  discovery_only_content_types:
    - News or release reports
    - Conference, training, or event information
    - Popular-science material, interpretation, interviews, or reprints
    - Drafts for comment, project-approval notices, or registration information
  rule: >-
    A domain hit only proves that the institution's retrieval route can be entered; a final citation
    must still check the document type, complete title, issuing or publishing institution, year or
    version, DOI or document number, completeness of the body text, and current status.

chinese_medical_association:
  name: Chinese Medical Association
  official_directory_url: https://www.cma.org.cn/col/col183/index.html
  canonical_domains:
    - cma.org.cn
    - "*.cma.org.cn"
    - medjournals.cn
    - "*.medjournals.cn"
    - rs.yiigle.com
  route_policy: >-
    First match by specialty branch name or alias; when a dedicated subdomain is registered,
    restrict the search to that subdomain first, otherwise first confirm the branch identity in the
    Chinese Medical Association's official directory, then restrict the search to cma.org.cn and the
    formal journal platforms.
  known_branch_sites:
    - branch: Respiratory Medicine Branch
      aliases: [respiratory medicine, respiratory and critical care medicine, CTS]
      canonical_url: https://ctschina.cma.org.cn/
      domain: ctschina.cma.org.cn
    - branch: Diabetes Branch
      aliases: [diabetes, endocrinology, CDS]
      canonical_url: https://diab.cma.org.cn/cn/index.aspx
      domain: diab.cma.org.cn
    - branch: Cardiovascular Medicine Branch
      aliases: [cardiovascular medicine, cardiology, CSC]
      canonical_url: https://csc.cma.org.cn/index.html
      domain: csc.cma.org.cn
