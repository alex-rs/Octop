schema_version: 1
purpose: >-
  Provide A-tier targeted retrieval routes for official international guidelines. A-tier only
  attests to the evidence eligibility of an institution and its formal guidelines; it does not
  mean that news, popular-science material, conference material, research papers, or older
  documents on that domain may all serve as the final basis.
verified_at: 2026-08-25

selection_policy:
  domestic_default: When addressing primary-care doctors in mainland China, use the current formal domestic documents first.
  international_use: Use when the user explicitly specifies an international guideline, or when the current domestic documents do not cover the target topic.
  default_pool: [who, nice, esc, ada, kdigo]
  default_pool_rule: >-
    For an ordinary international supplement, choose only the single best-matching site from the
    default pool and access it in a targeted way; if the first site genuinely does not cover the
    question, add at most one more site, and never treat the five sites as a routine parallel pool.
  specialty_direct_pool: [acg, aga, asge, esge, easl, aasld, ecco, gold, gina]
  specialty_direct_rule: >-
    When the user explicitly names, or the question clearly belongs to, a specific guideline
    system such as GINA, GOLD, ACG, AGA, ASGE, ESGE, EASL, AASLD, or ECCO, go directly to the
    corresponding official source instead of walking the default pool first, and do not for that
    reason add that site to the routine parallel pool for later questions.
  request_budget: Normally visit only 1 international site; at most 2 when necessary, executed sequentially, not in parallel.
  stop_rule: >-
    Stop immediately once an authoritative guideline has been obtained that is the latest version,
    has a certain document identity, has a verifiable body text, and is sufficient to cover the
    question; do not keep searching other international institutions for the sake of being
    "more complete".
  conflict_rule: Never use an international recommendation to silently override a current domestic standard; when a difference exists, state the applicable region, version, and issuing institution side by side.
  final_document_rule: The formal guideline or guidance document type, complete title, year or version, issuing institution, current status, and completeness of the original text must all be checked.

sources:
  - id: who
    name: World Health Organization
    aliases: [WHO, public health, infectious disease, non-communicable disease, drug policy]
    official_url: https://www.who.int/publications/i
    canonical_domains: [who.int, "*.who.int"]
  - id: nice
    name: National Institute for Health and Care Excellence (UK)
    aliases: [NICE, UK guidelines, clinical guidelines]
    official_url: https://www.nice.org.uk/guidance
    canonical_domains: [nice.org.uk, "*.nice.org.uk"]
  - id: acg
    name: American College of Gastroenterology
    aliases: [ACG, digestive disease, gastroenterology]
    official_url: https://gi.org/guidelines/
    canonical_domains: [gi.org, "*.gi.org"]
  - id: aga
    name: American Gastroenterological Association
    aliases: [AGA, digestive disease, gastroenterology]
    official_url: https://gastro.org/clinical-guidance/guidelines/
    canonical_domains: [gastro.org, "*.gastro.org"]
  - id: asge
    name: American Society for Gastrointestinal Endoscopy
    aliases: [ASGE, digestive endoscopy, endoscopy]
    official_url: https://www.asge.org/home/resources/publications/guidelines
    canonical_domains: [asge.org, "*.asge.org"]
  - id: esge
    name: European Society of Gastrointestinal Endoscopy
    aliases: [ESGE, digestive endoscopy, endoscopy]
    official_url: https://www.esge.com/publications/guidelines/
    canonical_domains: [esge.com, "*.esge.com"]
  - id: easl
    name: European Association for the Study of the Liver
    aliases: [EASL, liver disease, liver]
    official_url: https://easl.eu/publications/clinical-practice-guidelines/
    canonical_domains: [easl.eu, "*.easl.eu"]
  - id: aasld
    name: American Association for the Study of Liver Diseases
    aliases: [AASLD, liver disease, liver]
    official_url: https://www.aasld.org/practice-guidelines
    canonical_domains: [aasld.org, "*.aasld.org"]
  - id: ecco
    name: European Crohn's and Colitis Organisation
    aliases: [ECCO, inflammatory bowel disease, IBD, Crohn's disease, ulcerative colitis]
    official_url: https://www.ecco-ibd.eu/publications/ecco-guidelines-science.html
    canonical_domains: [ecco-ibd.eu, "*.ecco-ibd.eu"]
  - id: esc
    name: European Society of Cardiology
    aliases: [ESC, cardiovascular, heart disease]
    official_url: https://www.escardio.org/Guidelines
    canonical_domains: [escardio.org, "*.escardio.org"]
  - id: ada
    name: American Diabetes Association
    aliases: [ADA, diabetes, Standards of Care]
    official_url: https://professional.diabetes.org/standards-of-care
    canonical_domains: [diabetes.org, "*.diabetes.org", diabetesjournals.org, "*.diabetesjournals.org"]
  - id: kdigo
    name: "Kidney Disease: Improving Global Outcomes (KDIGO)"
    aliases: [KDIGO, kidney disease, chronic kidney disease, CKD]
    official_url: https://kdigo.org/guidelines/
    canonical_domains: [kdigo.org, "*.kdigo.org"]
  - id: gold
    name: Global Initiative for Chronic Obstructive Lung Disease
    aliases: [GOLD, chronic obstructive pulmonary disease, COPD]
    official_url: https://goldcopd.org/gold-reports/
    canonical_domains: [goldcopd.org, "*.goldcopd.org"]
  - id: gina
    name: Global Initiative for Asthma
    aliases: [GINA, asthma]
    official_url: https://ginasthma.org/reports/
    canonical_domains: [ginasthma.org, "*.ginasthma.org"]
