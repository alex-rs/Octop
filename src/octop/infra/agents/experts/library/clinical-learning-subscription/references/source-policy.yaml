# Even when they come from allowlisted websites, the following may not serve as final
# evidence; when the page links the formal original text, keep tracing back to it.
excluded_final_evidence_content_types:
  # Evidence reviews help discover formal guidelines or understand the evidence
  # background, but they cannot become the final source of this guideline-learning product.
  - systematic_review
  - meta_analysis
  - systematic_review_and_meta_analysis
  - narrative_review
  - scoping_review
  - umbrella_review
  - rapid_review
  - expert_review
  - literature_review
  # Primary research and academic discussion are likewise not normative documents and
  # must not replace the guideline/consensus/standard/policy original text.
  - randomized_controlled_trial
  - observational_study
  - case_report_or_case_series
  - editorial_commentary_or_letter
  - conference_abstract
  - preprint
  - retracted_or_expression_of_concern
  - science_popularization
  - guideline_or_consensus_interpretation
  - repost_or_excerpt
  - interview_or_media_report
  - public_health_check_education_or_interpretation
  - conference_training_or_event_report
  - marketing_or_institutional_promotion

