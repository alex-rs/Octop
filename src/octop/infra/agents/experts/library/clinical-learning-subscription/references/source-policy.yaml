# Effective only inside clinical_safety_modules.
# Patterns must carry word boundaries so that ordinary text such as delivery / import /
# point / 5 g of data is not caught by mistake; the medical context is identified by
# combinations such as "drug name/dosage/administration" rather than bare word fragments.
blocked_output_patterns:
  - "\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)\\s*(/\\s*(kg|m2|㎡|dose|day|d))"
  - "(?<![A-Za-z])(each time|single dose|first dose|loading dose)\\s*\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)"
  - "(?<![A-Za-z])(bid|tid|qid|qd|qn|qod|q\\d+h|ivgtt|iv\\s*drip)(?![A-Za-z])"
  - "(?<![A-Za-z])(po|im|iv|sc|ih)(?![A-Za-z])\\s*(administration|medication|injection|infusion|\\d)"
  - "(oral|intravenous drip|intravenous injection|intramuscular injection|subcutaneous injection|nebulized inhalation|sublingual)\\s*\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)?"
  - "(first dose|loading dose)\\s*(doubled|double|\\d+)"
  - "emergency action card"
  - "disease\\s*SOP"
  - "\\[specific medication\\]"
  - "\\[immediate management\\]"
  - "\\[prescription\\]"
  - "HIS.*(prompt|validation|configuration)"
  - "(this|the) patient\\s*(should|must|needs to|is advised to|may)\\s*(be diagnosed with|be given|be prescribed|take|immediately)"
