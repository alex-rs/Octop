product_mode: general_assistant_with_clinical_learning_safety_domain

# Ordinary tasks follow the general assistant rules; the rules below only constrain
# medical learning, medical-insurance policy, and "guideline-based" claims. Learning
# diagnosis and diagnostic-criteria study are both educational and must not be
# converted into disease diagnosis or treatment decisions for a specific patient.
allowed_learning_modes:
  - guideline_reading_and_learning_map
  - guideline_diagnostic_criteria_learning
  - guideline_section_expansion
  - guideline_learning_pathway
  - learning_baseline_assessment
  - study_plan_and_review
  - exam_oriented_material_recommendation
  - insurance_policy_retrospective_learning

# Clinical safety domain module list. Only these modules apply the source
# allowlist and the medical prohibited terms. Unlisted modules (general writing,
# translation, programming, data organization, other skill output, etc.) are always
# validated as general assistant output and are not downgraded or truncated for
# living inside this expert package.
clinical_safety_modules:
  - clinical_q_and_a
  - guideline_learning
  - daily_guideline_learning
  - guideline_section_expansion
  - guideline_learning_pathway
  - guideline_learning_diagnosis
  - guideline_update_reminder
  - professional_update_summary
  - insurance_policy_summary
  - insurance_policy_learning
  - insurance_policy_retrospective
  - exam_material_recommendation
  - high_risk_refusal

# Authoritative sources are required only inside clinical safety domain modules;
# general modules may cite any legal link.
source_restricted_modules:
  - clinical_q_and_a
  - guideline_learning
  - daily_guideline_learning
  - guideline_section_expansion
  - guideline_learning_pathway
  - guideline_learning_diagnosis
  - guideline_update_reminder
  - professional_update_summary
  - insurance_policy_summary
  - insurance_policy_learning
  - insurance_policy_retrospective
  - exam_material_recommendation

# Verification tiers: ordinary educational Q&A takes the fast verification path;
# only high-risk facts or an explicit version/original-text request escalate to full
# verification. Fast verification does not lower the authority standard; it reduces
# duplicate sources and useless fields.
fast_verification_required_checks:
  - authoritative_owner_and_domain
  - normative_document_type
  - title
  - issuing_organization
  - publication_year_or_version
  - readable_body_covering_the_claim

full_verification_trigger_fact_types:
  - latest_current_replaced_or_withdrawn_status
  - cross_version_comparison
  - exact_recommendation_or_evidence_grade
  - exact_section_table_page_or_item_locator
  - approved_indication
  - contraindication
  - dosage_and_administration
  - pregnancy_or_pediatric_use
  - serious_adverse_reaction
  - invasive_or_emergency_action
  - legal_regulatory_or_reimbursement_status

# International sources all keep A-tier eligibility, but the default search pool is
# fixed at five sites. An ordinary international supplement targets only one
# best-matching site; when the first site truly does not cover the question, at most
# one more may be added, and they must not be spread out in parallel.
international_default_pool:
  - who
  - nice
  - esc
  - ada
  - kdigo

international_specialty_direct_pool:
  - acg
  - aga
  - asge
  - esge
  - easl
  - aasld
  - ecco
  - gold
  - gina

# The normal target is 1 targeted search + 1 body fetch; the following are only the
# hard caps for the whole user turn, including failures, timeouts, downgrades, link
# patching, and rewrites. No stage may reset or exhaust the budget in parallel.
retrieval_budget_hard_limits:
  - searchfree_search_max_3
  - web_fetch_max_3
  - international_sites_normally_1
  - international_sites_absolute_max_2
  - final_normative_documents_normally_1

# Source tiers (A formal collection / B guideline discovery and controlled hosting /
# C web-wide discovery and explicit relay / D never enters the evidence chain):
#   A domestic: health commission/CDC/medical insurance/drug regulator and their
#     directly affiliated centers, Chinese Medical Association and its branches,
#     formal medical journal platforms, Chinese Preventive Medicine Association, and
#     verified professional organizations; international: WHO, NICE, and the official
#     guidelines of the international societies registered in this file.
#   B: Medlive guidelines, PREPARE, MedSci, DXY public medical content, etc., used only
#     to discover and trace back the original source; a designated B+ platform may act
#     as the body-of-text host for the same formal document only when it passes the six
#     identity checks.
#   C: when neither A nor B is found, a web-wide search is allowed. Only a clearly
#     attributed "relay page" may be output, and it must state the original journal or
#     guideline identity and its unverified status; it is not final evidence and does
#     not support precise recommendations, evidence grades, or high-risk drug information.
#   D does not enter the final evidence chain (encyclopedias/Q&A/WeChat public accounts, etc.).
# An authoritative domain is only the first threshold; the final evidence must also pass
# document-type and version-currency verification.
#
# A B+ controlled downgrade does not upgrade the whole platform into an authoritative
# source. Only when the original body of text cannot be checked because of 412, a
# CAPTCHA, JS blocking, a timeout, or an unobtainable body may the professional
# platforms below serve as the "formal full-text hosting channel"; at the same time
# there must be an S/A original publisher or formal journal metadata link, and the
# title, formulating institution, year/version, and DOI/document number must be
# independently checked. When the double verification cannot be completed, the page
# remains a lead only.
secondary_evidence_required_checks:
  - title
  - issuing_organization
  - publication_year_or_version
  - doi_or_document_number
  - complete_normative_full_text
  - current_version_status

# Mandatory disclosure fields for a C-tier web-wide relay. Any domain may appear in
# the output as a "background only" relay page only when it satisfies these fields at
# the same time; it must not thereby be upgraded to final evidence or a B+ body-of-text host.
attributed_relay_required_markers:
  - "relay page (C-tier, background only)"
  - "Original source"
  - "Verification status"
  - "no verifiable original text was obtained"

attributed_relay_required_identity_fields:
  - original_journal_or_issuer
  - original_title
  - publication_year_or_version
  - doi_or_document_number_if_available

attributed_relay_prohibited_fact_types:
  - approved_indication
  - contraindication
  - dosage_and_administration
  - pregnancy_or_pediatric_use
  - serious_adverse_reaction
  - invasive_or_emergency_action
  - recommendation_strength_or_evidence_grade

