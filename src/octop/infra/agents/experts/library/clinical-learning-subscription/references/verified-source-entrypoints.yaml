      - National primary-care diabetes guideline
    title: National Guideline for the Prevention and Management of Diabetes in Primary Care (2025)
    publisher: Office for Primary-Care Diabetes Prevention and Management of the Basic Public Health Service Program; Diabetes Branch of the Chinese Medical Association
    publication: Chinese Journal of Internal Medicine, 2025, Vol. 64, No. 12, 1169-1186
    doi: 10.3760/cma.j.cn112138-20250924-00572
    canonical_url: https://rs.yiigle.com/cmaid/1608618
    official_index_url: https://cs.medjournals.cn/cn/zhnkzz/toc/69512
    version_relation: The original text explicitly states that this version updates the 2018 and 2022 editions.
    status: current_candidate_requires_live_fetch
    verified_at: 2026-08-20
    recheck_after: 2026-09-20

  - id: china-hypertension-prevention-2024-revision
    aliases:
      - Adult hypertension in China
      - Latest hypertension guideline
      - Chinese hypertension prevention and treatment guideline
    title: Chinese Guideline for the Prevention and Treatment of Hypertension (2024 Revision)
    publisher: Revision Committee of the Chinese Guideline for the Prevention and Treatment of Hypertension, et al.
    publication: Chinese Journal of Hypertension (Chinese and English) 2024, Vol. 32, No. 7, 603-700
    doi: 10.16439/j.issn.1673-7245.2024.07.002
    canonical_url: https://cjournal.hep.com.cn/1673-7245/CN/10.16439/j.issn.1673-7245.2024.07.002
    version_relation: >-
      The original text explicitly states that this version is a revision completed on the basis of
      the 2018 edition; it is therefore the latest revision in the "Chinese Guideline for the
      Prevention and Treatment of Hypertension" series. The 2024 "Chinese Clinical Practice
      Guideline for Hypertension" is a parallel document formulated by a different issuing body, and
      no formal statement that either one rescinds or replaces the other has been obtained.
    status: current_candidate_requires_live_fetch
    verified_at: 2026-08-20
    recheck_after: 2026-09-20

  - id: china-adult-hypertension-practice-2024
    aliases:
      - Chinese clinical practice guideline for hypertension
    title: Chinese Clinical Practice Guideline for Hypertension
    publisher: Cardiovascular Medicine Branch of the Chinese Medical Association, et al.
    publication: Chinese Journal of Cardiology 2024, Vol. 52, No. 9, 985-1032
    doi: 10.3760/cma.j.cn112148-20240709-00377
    canonical_url: https://rs.yiigle.com/CN115399202004/1514630.htm
    version_relation: >-
      This is the clinical practice guideline released in 2024; before an explicit
      rescission/replacement statement from the issuing institution is obtained, do not claim that
      it has formally rescinded or replaced the Chinese Guideline for the Prevention and Treatment
      of Hypertension (2018 Revision).
    status: current_candidate_requires_live_fetch
    verified_at: 2026-08-20
    recheck_after: 2026-09-20
