schema_version: 1
purpose: >-
  Verified entry points for locating the formal original text of high-frequency topics. This table
  only reduces search guesswork; it does not replace fetching the original text at each
  canonical_url and checking the title/DOI.
scope: clinical-learning-subscription-only

entries:
